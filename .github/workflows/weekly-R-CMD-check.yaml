# Weekly dependency-drift check using the newest available package versions.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:

name: Weekly R-CMD-check

permissions: read-all

jobs:
  R-CMD-check-latest:
    runs-on: ${{ matrix.os }}

    name: ${{ matrix.os }} (latest dependencies)

    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - windows-latest
          - ubuntu-latest

    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          cache: false
          upgrade: 'TRUE'
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
